<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdTech Assignment Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1 class="my-4">EdTech Assignment Tracker</h1>

        <!-- Login/Signup -->
        <div id="auth-forms" class="card mb-4">
            <div class="card-body">
                <h2 class="card-title">Login / Signup</h2>
                <div class="mb-3">
                    <input type="text" id="username" class="form-control" placeholder="Username">
                </div>
                <div class="mb-3">
                    <input type="password" id="password" class="form-control" placeholder="Password">
                </div>
                <div class="mb-3">
                    <select id="role" class="form-select">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="signup()">Signup</button>
                <button class="btn btn-success" onclick="login()">Login</button>
            </div>
        </div>

        <div id="user-dashboards" style="display:none;">
            <!-- Teacher Dashboard -->
            <div id="teacher-dashboard" style="display:none;">
                <h3>Teacher Dashboard</h3>
                <div class="card mb-4">
                    <div class="card-body">
                        <h4 class="card-title">Create Assignment</h4>
                        <div class="mb-3">
                            <input type="text" id="assignment-title" class="form-control" placeholder="Title">
                        </div>
                        <div class="mb-3">
                            <textarea id="assignment-desc" class="form-control" placeholder="Description"></textarea>
                        </div>
                        <div class="mb-3">
                            <input type="date" id="assignment-due" class="form-control">
                        </div>
                        <button class="btn btn-primary" onclick="createAssignment()">Create Assignment</button>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">View Submissions</h4>
                        <div class="mb-3">
                            <input type="text" id="view-assignment-id" class="form-control" placeholder="Assignment ID">
                        </div>
                        <button class="btn btn-info" onclick="viewSubmissions()">View Submissions</button>
                        <div id="submissions-list" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Student Dashboard -->
            <div id="student-dashboard" style="display:none;">
                <h3>Student Dashboard</h3>
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Submit Assignment</h4>
                        <div class="mb-3">
                            <input type="text" id="submit-assignment-id" class="form-control" placeholder="Assignment ID">
                        </div>
                        <div class="mb-3">
                            <textarea id="submission-content" class="form-control" placeholder="Your submission"></textarea>
                        </div>
                        <button class="btn btn-primary" onclick="submitAssignment()">Submit</button>
                    </div>
                </div>
            </div>

            <!-- Assignments List -->
            <div class="card mt-4">
                <div class="card-body">
                    <h3 class="card-title">All Assignments</h3>
                    <div id="assignments-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
